<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Насосна станція — 3D перегляд</title>
<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  model-viewer {
    width: 100%;
    height: 100%;
    --poster-color: transparent;
    background-color: transparent;
  }
</style>
</head>
<body>
  <model-viewer
    src="https://raw.githubusercontent.com/paralellworkworld-sys/3dmod/main/model1.glb"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="18deg"
    shadow-intensity="0.9"
    exposure="1.05"
    camera-orbit="35deg 70deg auto"
    field-of-view="30deg"
    interaction-prompt="none"
    loading="eager">
  </model-viewer>
</body>
</html>
